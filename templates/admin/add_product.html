{% extends "admin_base.html" %}

{% block title %}Добавить товар{% endblock %}
{% block header_title %}Добавление нового товара{% endblock %}

{% block content %}
<div class="admin-card" style="max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    
    <!-- enctype="multipart/form-data" ОБЯЗАТЕЛЕН для загрузки файлов! -->
    <form method="POST" enctype="multipart/form-data">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            
            <!-- Название -->
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Название товара *</label>
                <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
                    box-sizing: border-box; height: 42px;" placeholder="Например: Туя Западная">
            </div>
            
            <!-- Бренд -->
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Бренд / Питомник</label>
                <input type="text" name="brand" style="width: 100%; padding: 10px; border: 1px solid #ccc;
                    border-radius: 4px; box-sizing: border-box; height: 42px;" placeholder="По умолчанию: Без бренда">
            </div>

            <!-- Категория -->
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Категория *</label>
                <select name="category" required
                        style="width: 100%; padding: 10px; border: 1px solid #ccc;
                            border-radius: 4px; box-sizing: border-box; height: 42px;">
                    <option value="Растения">Растения</option>
                    <option value="Материалы">Материалы</option>
                    <option value="Дизайн">Дизайн</option>
                </select>
            </div>

            <!-- Цена -->
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Цена (руб.) *</label>
                <input type="number" step="0.01" name="price" required style="width: 100%; padding: 10px; border: 1px solid #ccc;
                    border-radius: 4px; box-sizing: border-box; height: 42px;" placeholder="0.00">
            </div>

            <!-- Количество -->
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Количество *</label>
                <input type="number" step="0.001" name="quantity" required style="width: 100%; padding: 10px; border: 1px solid #ccc;
                border-radius: 4px; box-sizing: border-box; height: 42px;" placeholder="0">
            </div>

            <!-- Единица измерения -->
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Единица измерения</label>
                <select name="unit"
                        style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
                            box-sizing: border-box; height: 42px;">
                    <option value="шт.">шт.</option>
                    <option value="кв.м">кв.м</option>
                    <option value="рулон">рулон</option>
                    <option value="мешок">мешок</option>
                    <option value="кг">кг</option>
                </select>
            </div>
        </div>

        <!-- Описание -->
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Описание</label>
            <textarea name="description" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;" placeholder="Краткое описание товара..."></textarea>
        </div>

        <!-- Загрузка картинки -->
        <div style="margin-bottom: 30px; padding: 20px; background: #f9f9f9; border: 1px dashed #ccc; border-radius: 4px;">
            <label style="font-weight: bold; display: block; margin-bottom: 10px;">Фотография товара</label>
            <input type="file" name="image" accept="image/*" style="width: 100%;">
            <p style="font-size: 12px; color: #666; margin-top: 5px;">Рекомендуемый размер: 1200x1200 пикселей.</p>
        </div>

        <!-- Кнопки -->
        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn-main" style="padding: 12px 25px; font-size: 16px; cursor: pointer;">Сохранить товар</button>
            <a href="{{ url_for('admin.products_list') }}" style="padding: 12px 25px; font-size: 16px; text-decoration: none; color: #666; background: #eee; border-radius: 4px;">Отмена</a>
        </div>

    </form>
</div>
{% endblock %}
