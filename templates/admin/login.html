<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в админку</title>
    <style>
        body {
            font-family: Arial, sans-serif; display: flex; justify-content: center;
            align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px;
        }
        h2 {
            text-align: center; color: #2e7d32; margin-top: 0;
        }
        input {
            width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 10px; background-color: #2e7d32; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 16px;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .error {
            color: red; text-align: center; margin-bottom: 10px; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вход в админку</h2>

        <!-- Блок для вывода сообщений об ошибке (неверный пароль) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="password" name="password" placeholder="Введите пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
