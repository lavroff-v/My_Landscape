{% extends "client_base.html" %}

{% block title %}Вход — Мой ландшафт{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Вход в аккаунт</h2>
        <p class="auth-subtitle">Введите данные для доступа к своим заказам</p>

        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group password-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <span id="togglePassword" class="password-toggle">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">Войти</button>
        </form>

        <div class="auth-footer">
            Нет аккаунта? <a href="{{ url_for('auth.register') }}" class="auth-link">Зарегистрироваться</a>
        </div>
    </div>
</div>

<script>
    // Тот же скрипт для "глазка", что и в регистрации
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
</script>
{% endblock %}
